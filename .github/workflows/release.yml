name: Release

on:
  push:
    tags:
      - 'v*'            # 推送 v1.0.0 / v0.2.1 等标签时触发发布
  workflow_dispatch:     # 也允许手动触发

permissions:
  contents: write

jobs:
  # ---------- 交叉编译:多平台产物 ----------
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: "386"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/vshell-mcp-${GOOS}-${GOARCH}${EXT}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vshell-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/vshell-mcp-*        # 上传该平台的二进制
          if-no-files-found: error

  # ---------- 汇总产物,创建 GitHub Release ----------
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true          # 合并所有平台的产物到 dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum vshell-mcp-* > SHA256SUMS.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vshell-mcp-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
